@if (isOpen()) {
  <div class="app-dialog-backdrop" (click)="onBackdropClick($event)" role="presentation">
    <div
      class="app-dialog"
      [class.app-dialog--light]="theme() === 'light'"
      [class.app-dialog--dark]="theme() === 'dark'"
      [style.max-width]="maxWidth()"
      role="dialog"
      aria-modal="true"
    >
      @if (title() || eyebrow() || showClose()) {
        <div class="app-dialog__header">
          <div>
            @if (eyebrow()) {
              <span class="app-dialog__eyebrow">{{ eyebrow() }}</span>
            }
            @if (title()) {
              <h3 class="app-dialog__title">{{ title() }}</h3>
            }
          </div>

          @if (showClose()) {
            <button
              type="button"
              class="app-dialog__close"
              (click)="close()"
              [attr.aria-label]="'DASHBOARD.DIALOG.CLOSE' | translate"
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          }
        </div>
      }

      <div class="app-dialog__body">
        <ng-content></ng-content>
      </div>

      @if (hasFooter()) {
        <div class="app-dialog__footer">
          <ng-content select="[dialog-footer]"></ng-content>
        </div>
      }
    </div>
  </div>
}
