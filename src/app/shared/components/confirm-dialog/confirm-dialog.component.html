@if (isOpen()) {
  <div class="confirm-backdrop" (click)="onBackdropClick($event)" role="presentation">
    <div class="confirm-modal" role="alertdialog" aria-modal="true" aria-labelledby="confirm-dialog-title">
      <div class="confirm-modal__icon-box">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
          <line x1="12" y1="9" x2="12" y2="13"></line>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
      </div>

      <div class="confirm-modal__content">
        <h3 id="confirm-dialog-title" class="confirm-modal__title">{{ title() }}</h3>

        @if (description()) {
          <p class="confirm-modal__desc">{{ description() }}</p>
        }

        @if (targetName()) {
          <div class="confirm-modal__target">
            @if (targetBadge()) {
              <span class="confirm-modal__target-badge">{{ targetBadge() }}</span>
            }
            <strong class="confirm-modal__target-name">{{ targetName() }}</strong>
          </div>
        }

        @if (warningText()) {
          <div class="confirm-modal__warning">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span>{{ warningText() }}</span>
          </div>
        }
      </div>

      <div class="confirm-modal__actions">
        <button
          type="button"
          class="confirm-modal__btn confirm-modal__btn--danger"
          [disabled]="isLoading()"
          (click)="onConfirm()"
        >
          @if (isLoading()) {
            <span class="btn-spinner" aria-hidden="true"></span>
            <span>{{ 'DASHBOARD.DIALOG.DELETING' | translate }}</span>
          } @else {
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            <span>{{ confirmText() || ('DASHBOARD.DIALOG.CONFIRM_DELETE' | translate) }}</span>
          }
        </button>

        <button
          type="button"
          class="confirm-modal__btn confirm-modal__btn--cancel"
          (click)="onCancel()"
        >
          <span>{{ cancelText() || ('DASHBOARD.DIALOG.CANCEL' | translate) }}</span>
        </button>
      </div>
    </div>
  </div>
}
