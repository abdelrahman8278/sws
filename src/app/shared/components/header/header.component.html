<header class="header" [class.header--scrolled]="isScrolled()" role="banner">
  <div class="container header__container">
    <a href="#hero" class="header__brand" (click)="closeMenu()" aria-label="Stellar Media Homepage">
      STELLAR MEDIA<span class="header__brand-accent">✦</span>
    </a>

    <nav class="header__nav" aria-label="Main navigation">
      <ul class="header__nav-list">
        @for (item of navItems; track item.href) {
          <li class="header__nav-item">
            <a [href]="item.href" class="header__nav-link">{{ item.label }}</a>
          </li>
        }
      </ul>
    </nav>

    <div class="header__actions">
      <div class="header__locale-badge" title="Primary Language: English / Arabic Mandates Supported">
        <span>EN</span>
        <span class="header__locale-divider">/</span>
        <span class="header__locale-ar">العربية</span>
      </div>
      <a href="#contact" class="btn btn--primary btn--sm header__cta">
        <span>Consult Us</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </a>

      <!-- Mobile Hamburger Button -->
      <button
        type="button"
        class="header__hamburger"
        [class.header__hamburger--active]="isMenuOpen()"
        [attr.aria-expanded]="isMenuOpen()"
        aria-controls="mobile-nav"
        aria-label="Toggle navigation menu"
        (click)="toggleMenu()"
      >
        <span class="header__hamburger-bar"></span>
        <span class="header__hamburger-bar"></span>
        <span class="header__hamburger-bar"></span>
      </button>
    </div>
  </div>

  <!-- Mobile Navigation Overlay & Drawer -->
  <div
    id="mobile-nav"
    class="header__mobile-menu"
    [class.header__mobile-menu--open]="isMenuOpen()"
    aria-hidden="{{ !isMenuOpen() }}"
  >
    <div class="header__mobile-backdrop" (click)="closeMenu()" tabindex="-1"></div>
    <div class="header__mobile-panel">
      <div class="header__mobile-top">
        <a href="#hero" class="header__brand" (click)="closeMenu()">
          STELLAR MEDIA<span class="header__brand-accent">✦</span>
        </a>
        <button
          type="button"
          class="header__mobile-close"
          aria-label="Close navigation menu"
          (click)="closeMenu()"
        >
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <nav class="header__mobile-nav" aria-label="Mobile navigation">
        <ul class="header__mobile-list">
          @for (item of navItems; track item.href) {
            <li class="header__mobile-item">
              <a [href]="item.href" class="header__mobile-link" (click)="closeMenu()">
                {{ item.label }}
              </a>
            </li>
          }
        </ul>
      </nav>

      <div class="header__mobile-footer">
        <div class="header__locale-badge header__locale-badge--mobile">
          <span>EN</span>
          <span class="header__locale-divider">/</span>
          <span class="header__locale-ar">العربية</span>
        </div>
        <a href="#contact" class="btn btn--primary header__mobile-cta" (click)="closeMenu()">
          <span>Schedule Briefing</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </a>
      </div>
    </div>
  </div>
</header>
