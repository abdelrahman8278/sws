<section id="approach" class="section approach" aria-labelledby="approach-title">
  <div class="container">
    <div class="approach__header">
      <span class="section-eyebrow">{{ 'APPROACH.EYEBROW' | translate }}</span>
      <h2 id="approach-title" class="approach__title">{{ 'APPROACH.TITLE' | translate }}</h2>
      <p class="approach__subtitle">
        {{ 'APPROACH.SUBTITLE' | translate }}
      </p>
    </div>

    <div class="approach__grid">
      @for (step of steps(); track step.stepNumber) {
        <article class="approach__card">
          <div class="approach__card-top">
            <span class="approach__card-number">{{ step.stepNumber }}</span>
            <span class="approach__card-phase">{{ step.phaseKey | translate }}</span>
          </div>

          <h3 class="approach__card-title">{{ step.titleKey | translate }}</h3>
          <p class="approach__card-desc">{{ step.descKey | translate }}</p>

          <div class="approach__card-indicator" aria-hidden="true"></div>
        </article>
      }
    </div>
  </div>
</section>
