<section id="services" class="section services" aria-labelledby="services-title">
  <div class="container">
    <div class="services__header">
      <span class="section-eyebrow">{{ 'SERVICES.EYEBROW' | translate }}</span>
      <h2 id="services-title" class="services__title">{{ 'SERVICES.TITLE' | translate }}</h2>
      <p class="services__subtitle">
        {{ 'SERVICES.SUBTITLE' | translate }}
      </p>
    </div>

    <div class="services__grid">
      @for (service of services(); track service.id) {
        <app-service-card [service]="service" />
      }
    </div>
  </div>
</section>
