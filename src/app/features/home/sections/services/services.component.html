<section id="services" class="section services" aria-labelledby="services-title">
  <div class="container">
    <div class="services__header">
      <span class="section-eyebrow">{{ 'SERVICES.EYEBROW' | translate }}</span>
      <h2 id="services-title" class="services__title">{{ 'SERVICES.TITLE' | translate }}</h2>
      <p class="services__subtitle">
        {{ 'SERVICES.SUBTITLE' | translate }}
      </p>
    </div>

    <div class="services__grid">
      @if (isLoading()) {
        @for (_ of skeletonItems; track $index) {
          <div class="service-card-skeleton" aria-hidden="true">
            <div class="skeleton-box service-card-skeleton__icon"></div>
            <div class="skeleton-box service-card-skeleton__num"></div>
            <div class="skeleton-box service-card-skeleton__title"></div>
            <div class="skeleton-box service-card-skeleton__desc"></div>
            <div class="skeleton-box service-card-skeleton__desc service-card-skeleton__desc--short"></div>
            <div class="skeleton-box service-card-skeleton__footer"></div>
          </div>
        }
      } @else {
        @for (service of services(); track service.id) {
          <app-service-card [service]="service" />
        }
      }
    </div>
  </div>
</section>
